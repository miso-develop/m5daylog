[project]
name = "m5daylog"
version = "0.1.0"
description = "M5Daylog PoC Python CLI (local-first audio lifelog scaffold)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
m5daylog = "m5daylog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m5daylog"]

[tool.uv]
package = true
