version: 1

policy:
  exactly_one_active_role_per_chat: true
  repository_is_durable_source_of_truth: true
  silent_cross_role_work: false
  implementation_self_merge: false

roles:
  general:
    contract: .agent/roles/general.md
    source_modify: false
    commit: false
    push: false
    pr_create: false
    pr_review: false
    merge: false
    primary_outputs:
      - clarification
      - routing
      - issue_proposal

  specification:
    contract: .agent/roles/specification.md
    source_modify: false
    specification_modify: true
    issue_modify: true
    commit: true
    push: true
    pr_create: true
    pr_review: false
    merge: false
    primary_outputs:
      - map
      - decision
      - spec
      - task
      - acceptance_criteria

  implementation:
    contract: .agent/roles/implementation.md
    multiple_instances_allowed: true
    domain_scope_required: true
    source_modify: true
    commit: true
    push: true
    pr_create: true
    pr_review_own_work: false
    merge: false
    primary_outputs:
      - implementation
      - tests
      - branch
      - commits
      - pull_request

  review:
    contract: .agent/roles/review.md
    source_modify: false
    commit: false
    push: false
    pr_create: false
    pr_review: true
    merge: false
    primary_outputs:
      - review_findings
      - ready_for_integration
      - rework_required

  integration:
    contract: .agent/roles/integration.md
    source_modify: limited
    commit: limited
    push: limited
    pr_review: true
    merge: true
    primary_outputs:
      - integration_verdict
      - merge
      - follow_up_handoff

  security:
    contract: .agent/roles/security.md
    source_modify: false
    commit: false
    push: false
    pr_create: false
    pr_review: true
    merge: false
    primary_outputs:
      - threat_model
      - security_finding
      - security_issue
      - risk_assessment

notes:
  - These values are machine-readable policy metadata, not by themselves GitHub permission enforcement.
  - Important restrictions should also be enforced with branch protection, required checks, scoped credentials, or a Control Plane.
  - Integration source/commit permission marked 'limited' means integration-only mechanical changes may be permitted by its role contract; functional implementation must be handed back to Implementation.
  - Cross-agent runtime supervision, scheduling, stall detection, and automatic recovery are intentionally outside this ChatGPT role catalog and belong to an external Control Plane when present.
