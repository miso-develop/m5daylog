name: PC Python 3.12 Raw Regression

on:
  pull_request:
    paths: ['pc/**', '.github/workflows/pc-python312.yml']
  push:
    branches: [main, task/140]
    paths: ['pc/**', '.github/workflows/pc-python312.yml']

permissions:
  contents: read

jobs:
  pc-python312:
    name: pc:python312 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up CPython 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Assert exact revision and system Python
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os,subprocess,sys;
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
          print('TESTED_HEAD='+head);
          print('SYSTEM_PYTHON='+sys.version.split()[0]);
          assert head == os.environ['EXPECTED_HEAD'];
          assert sys.version_info[:2] == (3,12)"
      - name: Install fixed uv tool version
        run: |
          python -m pip install --disable-pip-version-check uv==0.10.0
          uv --version
      - name: Validate lock freshness and frozen clean environment
        working-directory: pc
        run: |
          uv lock --check
          uv sync --frozen
          uv run --frozen python -c "import sys; print('UV_PYTHON='+sys.version.split()[0]); assert sys.version_info[:2] == (3,12)"
      - name: Packaged CLI and isolated SQLite smoke
        working-directory: pc
        run: |
          uv run --frozen m5daylog --help
          python -c "import pathlib,sqlite3,subprocess,tempfile; db=pathlib.Path(tempfile.mkdtemp())/'smoke.db'; subprocess.run(['uv','run','--frozen','m5daylog','init','--db',str(db)],check=True); cx=sqlite3.connect(db); tables={row[0] for row in cx.execute('select name from sqlite_master')}; cx.close(); assert {'devices','recordings','jobs','artifacts'} <= tables; print('SQLITE_SMOKE=PASS')"
      - name: Full PC unit regression (Windows native junction gates enabled)
        working-directory: pc
        env:
          M5DAYLOG_REQUIRE_NTFS_JUNCTION: ${{ runner.os == 'Windows' && '1' || '0' }}
          M5DAYLOG_REQUIRE_B1_JUNCTION: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Capacity-specific synthetic tests (if present at exact HEAD)
        working-directory: pc
        run: >-
          python -c "import pathlib,subprocess,sys;
          present=pathlib.Path('tests/test_capacity.py').is_file();
          print('CAPACITY_TEST='+('RUNNING' if present else 'NOT_PRESENT_IN_THIS_HEAD'));
          sys.exit(subprocess.call(['uv','run','--frozen','python','-m','unittest','discover','-s','tests','-p','test_capacity.py','-v']) if present else 0)"
      - name: Tracked repository security scan
        run: python scripts/security_scan.py
