name: PC VAD verification

on:
  pull_request:
    paths:
      - 'pc/**'
      - '.github/workflows/pc-vad.yml'

permissions:
  contents: read

jobs:
  pc-vad:
    name: pc:vad-synthetic-locked-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Run synthetic regression suite without installing the AI model
        run: PYTHONPATH=pc/src python3.11 -m unittest discover -s pc/tests -v

      - name: Verify frozen dependency graph
        run: |
          python3.11 -m venv /tmp/pc-uv
          /tmp/pc-uv/bin/pip install --disable-pip-version-check uv
          cd pc
          /tmp/pc-uv/bin/uv lock --check --python 3.11
          /tmp/pc-uv/bin/uv sync --frozen

      - name: Run complete synthetic suite with frozen NumPy/Silero dependencies
        working-directory: pc
        run: /tmp/pc-uv/bin/uv run --frozen python -m unittest discover -s tests -v

      - name: Real Silero CPU ONNX model and silence smoke
        working-directory: pc
        run: |
          /tmp/pc-uv/bin/uv run --frozen python - <<'PY'
          import hashlib
          from importlib import resources
          from m5daylog.vad import EXPECTED_MODEL_SHA256, SileroCPU
          model = resources.files('silero_vad.data').joinpath('silero_vad.onnx')
          checksum = hashlib.sha256(model.read_bytes()).hexdigest()
          assert checksum == EXPECTED_MODEL_SHA256
          runtime = SileroCPU()
          assert runtime.model_sha256 == EXPECTED_MODEL_SHA256
          assert runtime.detect(b'\x00\x00' * 16000) == []
          import numpy as np
          assert runtime.detect_float32(np.zeros(16000, dtype=np.float32)) == []
          print('LIVE_SILERO_CPU_SMOKE_PASS model_sha256=' + checksum)
          PY

  pc-vad-windows:
    name: pc:vad-windows-locked-smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install uv and validate frozen lock
        working-directory: pc
        run: |
          python -m pip install --disable-pip-version-check uv
          uv lock --check --python 3.11
          uv sync --frozen

      - name: Run full Windows PC unit tests
        working-directory: pc
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Windows CPU ONNX silent input smoke
        working-directory: pc
        run: |
          uv run --frozen python -c "import numpy as np; from m5daylog.vad import SileroCPU; model = SileroCPU(); assert model.detect(bytes(32000)) == []; assert model.detect_float32(np.zeros(16000, dtype=np.float32)) == []; print('WINDOWS_SILERO_CPU_SMOKE_PASS')"
