name: PC VAD candidate verification

on:
  pull_request:
    paths:
      - 'pc/**'
      - '.github/workflows/pc-vad.yml'

permissions:
  contents: read

jobs:
  pc-vad:
    name: pc:vad-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Check Python 3.11 and run dependency-free synthetic VAD suite
        run: |
          python3.11 --version
          PYTHONPATH=pc/src python3.11 -m unittest discover -s pc/tests -p 'test_vad*.py' -v

      - name: Resolve candidate locked environment
        if: always()
        run: |
          python3.11 -m venv /tmp/pc-uv
          /tmp/pc-uv/bin/pip install --disable-pip-version-check uv
          cd pc
          /tmp/pc-uv/bin/uv lock --python 3.11

      - name: Emit candidate lock and model digest for explicitly verified pinning
        if: always()
        run: |
          python3.11 -m venv /tmp/pc-model
          /tmp/pc-model/bin/pip download --disable-pip-version-check --no-deps -d /tmp/pc-wheels silero-vad==6.2.3
          python3.11 - <<'PY'
          import base64
          import hashlib
          import zipfile
          from pathlib import Path
          wheel = next(Path('/tmp/pc-wheels').glob('silero_vad-6.2.3-*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              model_name = next(name for name in archive.namelist() if name.endswith('/silero_vad.onnx'))
              data = archive.read(model_name)
          print('CANDIDATE_SILERO_6_2_3_MODEL_SHA256=' + hashlib.sha256(data).hexdigest())
          blob = Path('pc/uv.lock').read_bytes()
          print('CANDIDATE_UV_LOCK_SHA256=' + hashlib.sha256(blob).hexdigest())
          print('CANDIDATE_UV_LOCK_BASE64_BEGIN')
          encoded = base64.b64encode(blob).decode('ascii')
          for i in range(0, len(encoded), 120):
              print(encoded[i:i+120])
          print('CANDIDATE_UV_LOCK_BASE64_END')
          PY
