name: PC Maintenance Release

on:
  pull_request:
    paths:
      - 'pc/src/m5daylog/maintenance_release.py'
      - 'pc/tests/test_maintenance_release.py'
      - 'pc/tests/test_maintenance_file_identity.py'
      - 'pc/MAINTENANCE_RELEASE_121.md'
      - '.github/workflows/pc-maintenance.yml'
  push:
    branches:
      - main
    paths:
      - 'pc/src/m5daylog/maintenance_release.py'
      - 'pc/tests/test_maintenance_release.py'
      - 'pc/tests/test_maintenance_file_identity.py'
      - 'pc/MAINTENANCE_RELEASE_121.md'
      - '.github/workflows/pc-maintenance.yml'

permissions:
  contents: read

jobs:
  pc-maintenance:
    name: pc:maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "TESTED_HEAD=$EXPECTED_HEAD"
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Full PC stdlib regression
        working-directory: pc
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Security scan
        run: python scripts/security_scan.py

  pc-maintenance-windows:
    name: pc:maintenance-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "TESTED_HEAD=$EXPECTED_HEAD"
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Native Windows maintenance and NTFS junction regressions
        working-directory: pc
        env:
          PYTHONPATH: src
          M5DAYLOG_REQUIRE_NTFS_JUNCTION: '1'
        run: python -m unittest discover -s tests -p 'test_maintenance*.py' -v
