name: PC Maintenance Release

on:
  pull_request:
    paths:
      - 'pc/src/m5daylog/maintenance_release.py'
      - 'pc/tests/test_maintenance_release.py'
      - '.github/workflows/pc-maintenance.yml'
  push:
    branches:
      - main
    paths:
      - 'pc/src/m5daylog/maintenance_release.py'
      - 'pc/tests/test_maintenance_release.py'
      - '.github/workflows/pc-maintenance.yml'

permissions:
  contents: read

jobs:
  pc-maintenance:
    name: pc:maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Full PC stdlib regression
        working-directory: pc
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Security scan
        run: python scripts/security_scan.py
