name: 'PC #126 B1 Synthetic Qualification'

on:
  pull_request:
    paths:
      - 'pc/MAINTENANCE_WINDOWS_B1_126.md'
      - 'pc/tests/test_maintenance_windows_b1_witness.py'
      - 'pc/tests/test_maintenance_windows_b1_guard.py'
      - '.github/workflows/pc-qualification-b1-126.yml'
  push:
    branches: [main]
    paths:
      - 'pc/MAINTENANCE_WINDOWS_B1_126.md'
      - 'pc/tests/test_maintenance_windows_b1_witness.py'
      - 'pc/tests/test_maintenance_windows_b1_guard.py'
      - '.github/workflows/pc-qualification-b1-126.yml'

permissions:
  contents: read

jobs:
  source-only-fixtures:
    name: 'pc:b1-fixtures (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); print('TESTED_HEAD='+actual); assert actual==os.environ['EXPECTED_HEAD'], 'unexpected checkout'"
      - name: Source-only B1 witness and temporary journal tests
        working-directory: pc
        env:
          PYTHONPATH: src
          M5DAYLOG_REQUIRE_B1_JUNCTION: '1'
        run: python -m unittest discover -s tests -p 'test_maintenance_windows_b1_*.py' -v
      - name: Full PC stdlib regression
        working-directory: pc
        env:
          PYTHONPATH: src
          M5DAYLOG_REQUIRE_B1_JUNCTION: '1'
        run: python -m unittest discover -s tests -v
      - name: Tracked repository security scan
        run: python scripts/security_scan.py
